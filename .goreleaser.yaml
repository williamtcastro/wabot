version: 2

builds:
  - main: .
    binary: wabot
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "wabot_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, "docs/**/*.md"]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
