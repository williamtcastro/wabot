# docker compose up -d, after copying .env.example to .env and setting WAME_TOKEN.
# First login: docker compose run --rm wame login   (or remotely: wame admin, see docs/DOCKER.md)
services:
  wame:
    build: .
    image: wame
    restart: unless-stopped
    environment:
      WAME_TOKEN: ${WAME_TOKEN:?set WAME_TOKEN to an owner secret of 16+ characters}
      WAME_WEBHOOK: ${WAME_WEBHOOK:-}
      WAME_WEBHOOK_SECRET: ${WAME_WEBHOOK_SECRET:-}
      WAME_WEBHOOK_FILTER: ${WAME_WEBHOOK_FILTER:-}
      WAME_RATE: ${WAME_RATE:-}
      WAME_QUEUE_JITTER: ${WAME_QUEUE_JITTER:-}
      WAME_QUEUE_QUIET_HOURS: ${WAME_QUEUE_QUIET_HOURS:-}
      WAME_QUEUE_TIMEZONE: ${WAME_QUEUE_TIMEZONE:-}
      TZ: ${TZ:-}
      WAME_LOG_FORMAT: ${WAME_LOG_FORMAT:-}
      WAME_ALERT_GOTIFY: ${WAME_ALERT_GOTIFY:-}
      WAME_ALERT_GOTIFY_TOKEN: ${WAME_ALERT_GOTIFY_TOKEN:-}
      WAME_ALERT_DELAY: ${WAME_ALERT_DELAY:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Docker-managed volume (default). For a folder on the host instead, swap the line for
      # "- ./data:/data" and see docs/DOCKER.md for its permissions.
      - wame-data:/data

volumes:
  wame-data:
