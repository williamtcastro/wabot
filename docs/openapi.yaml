openapi: 3.0.3
info:
  title: wame HTTP API
  version: "2.0"
  description: |
    A small WhatsApp bot built on [whatsmeow](https://github.com/tulir/whatsmeow).

    **Auth:** send `Authorization: Bearer <token>` with an API token (`wame_…`, from `wame token create`
    or `POST /tokens`) or the owner secret (`WAME_TOKEN`, at least 16 characters). Click **Authorize**
    above to set it for the "Try it out" buttons. `?token=` is accepted only on `GET /events`, `GET /qr`
    and `GET /media/{seq}`. Every route needs a scope (`read`, `send` or `admin`; admin implies all), and
    tokens limited to chats only see and act on those chats. Before any token was ever created and without
    an owner secret, the API runs token-less: loopback connections to a loopback `Host`, same-origin only;
    anything else gets 403. After 10 failed logins in a minute an IP gets 429 for a minute.

    **MCP:** `/mcp` serves the Model Context Protocol (streamable HTTP) for AI agents with the same tokens.
    It isn't described here; see docs/MCP.md.

    **Recipients** (`to`, `chat`): a phone number with country code in any format
    (`5511999999999`, `+55 (11) 99999-9999`) or a full JID (`…@s.whatsapp.net`, `…@g.us`, `…@lid`).
    Phone numbers are looked up on WhatsApp first, so variants like Brazil's 9th digit just work.
    A number that isn't on WhatsApp is a 400.

    **Rate limiting:** everything that sends a message (text, file, reaction, edit, delete) is spaced out
    by the server (`-rate`, `-chat-gap`). A request waits for its slot up to `-max-wait`; beyond that it gets
    429 with `Retry-After`. Number lookups (uncached phone numbers, `/check`, `/typing`) have a separate
    limit of 3 × `-rate` per minute with the same 429 behaviour.

    **Errors** are always `{"error": "..."}`: 400 bad input, 401 missing/invalid/revoked/expired token,
    403 missing scope or chat outside the token's allowlist (or not local in token-less mode), 404 not found,
    409 idempotency key reused for a different request, 410 media expired,
    429 rate limited, 502 WhatsApp failure or not logged in, 504 timeout.
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: Session
  - name: Messaging
  - name: Reading
  - name: Directory
  - name: Contacts
  - name: Queue
  - name: Admin
  - name: Tokens
  - name: Docs

paths:
  /status:
    get:
      tags: [Session]
      summary: Connection and login state
      description: "`qr` is shown to admin callers only; `jid` and `push_name` are hidden from tokens limited to chats."
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /qr:
    get:
      tags: [Session]
      summary: Login QR code as PNG
      description: Only available while not logged in. Codes rotate about every 20 s; a new round starts by itself when they run out.
      responses:
        "200":
          description: QR image
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /pair:
    post:
      tags: [Session]
      summary: Log in with a pairing code instead of a QR
      description: "On the phone: Linked devices → Link a device → Link with phone number instead."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+5511988887777" }
      responses:
        "200":
          description: Pairing code
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: "ABCD-EFGH" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /logout:
    post:
      tags: [Session]
      summary: Unlink this device and delete the session
      description: >-
        Unlinks the device and, if that worked, also deletes your own contacts (names, tags, notes,
        language, time zone), the WhatsApp profile cache, and group names, admins and members in
        one transaction. Messages and the audit log are kept. Opt-outs are kept, so a logout can't
        let anyone who opted out be messaged again. The same happens when the phone unlinks
        the device; a disconnect or restart while logged in keeps everything. Audited as
        contacts_wipe (detail "N contacts", never names). Run `wame backup` first to keep your notes.
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /send:
    post:
      tags: [Messaging]
      summary: Send a text message
      description: |
        Optionally quote a stored message with `reply_to` (not a deleted one; an edited one is quoted with its
        current text). With an idempotency key, a repeat within 24 h returns the first result instead of
        sending again; failed sends aren't remembered. The key is bound to `to`, `text` and `reply_to`; reusing it
        for a different request is a 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, text]
              properties:
                to: { type: string, example: "5511999999999" }
                text: { type: string, example: "Hello from *wame* 👋" }
                reply_to: { type: string, description: "id of a stored message in the same chat to quote", example: "3EB0C767D26A1D0F5E2A" }
                idempotency_key: { type: string, maxLength: 200, description: "Same as the Idempotency-Key header; the header wins." }
      responses:
        "200": { $ref: "#/components/responses/MessageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/Timeout" }

  /send/file:
    post:
      tags: [Messaging]
      summary: Send an image or document
      description: |
        Images (detected from the content) go as photos, anything else as a document. Max 64 MB. An idempotency
        key is bound to `to`, the file name, `caption`, `reply_to` and the file's SHA-256; reusing it for a
        different request is a 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [to, file]
              properties:
                to: { type: string, example: "5511999999999" }
                file: { type: string, format: binary }
                caption: { type: string }
                reply_to: { type: string, description: "id of a stored message in the same chat to quote" }
                idempotency_key: { type: string, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/MessageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/Timeout" }

  /react:
    post:
      tags: [Messaging]
      summary: React to a message
      description: An empty `emoji` removes your reaction. Returns the reaction as a Message (`type` reaction).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, id]
              properties:
                chat: { type: string, example: "5511999999999" }
                id: { type: string, example: "3EB0C767D26A1D0F5E2A" }
                emoji: { type: string, example: "👍" }
      responses:
        "200": { $ref: "#/components/responses/MessageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/Timeout" }

  /edit:
    post:
      tags: [Messaging]
      summary: Edit one of your text messages
      description: Only your own text messages, within 20 minutes of sending (WhatsApp's edit window); otherwise 400. Returns the updated Message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, id, text]
              properties:
                chat: { type: string, example: "5511999999999" }
                id: { type: string, example: "3EB0C767D26A1D0F5E2A" }
                text: { type: string, example: "fixed typo" }
      responses:
        "200": { $ref: "#/components/responses/MessageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/Timeout" }

  /delete:
    post:
      tags: [Messaging]
      summary: Delete a message for everyone
      description: Your own messages, or other people's in groups where you're an admin. Returns the updated Message (`deleted` true, empty `text`). The stored copy of the original is dropped, so its media can no longer be downloaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, id]
              properties:
                chat: { type: string, example: "5511999999999" }
                id: { type: string, example: "3EB0C767D26A1D0F5E2A" }
      responses:
        "200": { $ref: "#/components/responses/MessageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/Timeout" }

  /read:
    post:
      tags: [Messaging]
      summary: Send read receipts
      description: Marks the given incoming messages as read, or the latest 50 incoming messages in the chat when no ids are given. Own messages, reactions and unknown ids are skipped. Also moves the chat's read position (used for `unread` in /chats) to the whole chat, or up to the newest of the given ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat]
              properties:
                chat: { type: string, example: "5511999999999" }
                id: { type: string }
                ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Number of messages marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked: { type: integer, example: 3 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /typing:
    post:
      tags: [Messaging]
      summary: Show a typing or recording indicator
      description: Counts against the number-lookup limit. Without `-online`, the account goes "available" for `typing`/`recording` and back to unavailable on `paused`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat]
              properties:
                chat: { type: string, example: "5511999999999" }
                state: { type: string, enum: [typing, recording, paused], default: typing }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /messages:
    get:
      tags: [Reading]
      summary: Stored messages
      description: |
        Without `since`: newest first by timestamp. With `since`: oldest first by `seq`, starting after
        `since` (cursor paging: pass the last `seq` you got as the next `since`).
      parameters:
        - $ref: "#/components/parameters/Chat"
        - $ref: "#/components/parameters/Type"
        - $ref: "#/components/parameters/FromMe"
        - $ref: "#/components/parameters/IsGroup"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Q"
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 1000 } }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /messages/wait:
    get:
      tags: [Reading]
      summary: Long-poll for new messages
      description: |
        Returns as soon as at least one message matching the filters exists after `since`, or after `timeout`
        seconds with an empty list. Without `since` it waits for messages that arrive after the request.
        Pass `next_since` as `since` on the next call.
      parameters:
        - $ref: "#/components/parameters/Chat"
        - $ref: "#/components/parameters/Type"
        - $ref: "#/components/parameters/FromMe"
        - $ref: "#/components/parameters/IsGroup"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Q"
        - { name: timeout, in: query, description: "Seconds to wait.", schema: { type: integer, default: 30, maximum: 120 } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: New messages (possibly none) and the cursor for the next call
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  next_since: { type: integer, format: int64, example: 1043 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { description: "Too many open streams for this token (max 4)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /events:
    get:
      tags: [Reading]
      summary: Live Server-Sent Events stream
      description: |
        Events: `message` (a Message, with `id: <seq>`), `update` (the Message after an edit or delete) and
        `status` (a Status). Stored messages after a starting seq are replayed first: a numeric `Last-Event-ID`
        header (sent by `EventSource` on reconnect) wins, then `since`, otherwise only new messages. Messages
        imported by a history sync are streamed too. Filters apply to `message` and `update`. A `: ping` comment is sent every 25 s. Swagger can't display streams; use
        `curl -N` or `EventSource`.
      parameters:
        - $ref: "#/components/parameters/Chat"
        - $ref: "#/components/parameters/Type"
        - $ref: "#/components/parameters/FromMe"
        - $ref: "#/components/parameters/IsGroup"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Q"
        - name: events
          in: query
          description: "Comma-separated subset of message,update,status,queue. Default: message,update,status."
          schema: { type: string, example: "message,update" }
        - name: Last-Event-ID
          in: header
          description: "Resume after this seq. Takes precedence over `since`; a non-numeric value is ignored."
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }
              example: "id: 1043\nevent: message\ndata: {\"seq\":1043,\"text\":\"oi!\"}\n\n"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { description: "Too many open streams for this token (max 4)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /media/{seq}:
    get:
      tags: [Reading]
      summary: Download the media of a stored message
      description: |
        Fetched from WhatsApp and decrypted on each request. Capped at 100 MB of actual data. Images (not SVG),
        audio, video and PDF are served inline with their own Content-Type; anything else as
        `application/octet-stream` with `Content-Disposition: attachment`. Responses carry
        `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox; default-src 'none'` and
        `Referrer-Policy: no-referrer`. A deleted message's media is a 404.
      parameters:
        - { name: seq, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The file, with a Content-Disposition file name
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Media expired on WhatsApp's servers (WhatsApp answered 403, 404 or 410)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /chats:
    get:
      tags: [Reading]
      summary: Conversations by most recent activity
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 1000 } }
      responses:
        "200":
          description: Chats
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /contacts:
    get:
      tags: [Contacts]
      summary: People from the address book and your own contact list
      description: |
        Merged and sorted by name, with one name per person (own > address book > business > ~push name > +number).
        Never includes notes and never asks WhatsApp. Tokens limited to chats get only those chats. Requires read.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Part of a name, a tag or part of the number." }
        - { name: tag, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true, description: "Only people with every tag given (repeat, or separate with commas)." }
        - { name: known, in: query, schema: { type: boolean }, description: "Leave out people known only by push name or number." }
        - { name: limit, in: query, schema: { type: integer, default: 1000, maximum: 5000 } }
      responses:
        "200":
          description: Contacts sorted by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Contacts]
      summary: Empty your own contact list
      description: The phone's address book isn't touched. Audited as contact_delete_all. Requires admin.
      parameters:
        - { name: all, in: query, required: true, schema: { type: boolean, enum: [true] }, description: "Must be true; without it the request is refused." }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, properties: { deleted: { type: integer, description: "How many people were in the list" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /contacts/tags:
    get:
      tags: [Contacts]
      summary: Your tags with how many people have each
      description: Requires read; not available to tokens limited to chats.
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TagCount" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /contacts/{number}:
    parameters:
      - { name: number, in: path, required: true, schema: { type: string }, description: "Number (5511999999999, +5511999999999) or URL-escaped JID", example: "5511999999999" }
    get:
      tags: [Contacts]
      summary: One person's profile
      description: |
        Never asks WhatsApp unless refresh=1; someone wame knows nothing about is still a 200. Requires read.
        Tokens limited to chats get 403 for anyone outside their list, and inside it the basic view (jid,
        phone, lid, names, own.tags, whatsapp.on_whatsapp and whatsapp.stale). The full view (notes, about,
        picture, business profile, activity, queue, opted_out, tokens) needs an unrestricted admin token (admin
        tokens are never issued with a chat list; the handler checks it again as a safety net).
        PUT and PATCH still answer with ContactView.

        refresh=1 asks WhatsApp now: 2 to 4 lookups from the shared lookup budget, at most once per person per
        5 minutes (a second one returns the cache with refreshed false). It needs an unrestricted admin token,
        checked before anything is looked up. It is also refused (403 "refresh=1 is refused from another site or
        port") when Sec-Fetch-Site is present and not same-origin or none, or when an Origin or Referer host
        differs from Host, so a web page can't spend lookups with an <img>. A WhatsApp error is stored in
        whatsapp.error and the answer is still 200 with refreshed false. Audited as contact_refresh.
      parameters:
        - name: refresh
          in: query
          schema: { type: boolean }
          description: "1, true, 0 or false; anything else is a 400. 403 \"refresh=1 needs an admin token without a chat allowlist\" for any caller without an unrestricted admin token; 403 \"refresh=1 is refused from another site or port\" for requests from another page."
      responses:
        "200": { description: The profile, content: { application/json: { schema: { $ref: "#/components/schemas/ContactProfile" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
    put:
      tags: [Contacts]
      summary: Replace your own fields for a person
      description: |
        Fields left out are cleared; all empty removes the person from your list. The body must be a JSON object
        (null is a 400). While logged in, a number is resolved once on WhatsApp; one WhatsApp doesn't know is
        stored as typed, like PATCH. Audited as contact_set. Requires admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
            example: { name: Maria, tags: [clients, vip], notes: "prefers mornings", language: pt-BR, time_zone: America/Sao_Paulo }
      responses:
        "200": { description: The person, content: { application/json: { schema: { $ref: "#/components/schemas/ContactView" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: "The body is over 64 KB" }
    patch:
      tags: [Contacts]
      summary: Change some of your own fields for a person
      description: |
        Only the fields given change; null or "" clears one. add_tags and remove_tags edit the tags without
        overwriting the others. Never asks WhatsApp. Audited as contact_set. Requires admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactInput" }
            example: { add_tags: [vip], notes: null }
      responses:
        "200": { description: The person, content: { application/json: { schema: { $ref: "#/components/schemas/ContactView" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: "The body is over 64 KB" }
    delete:
      tags: [Contacts]
      summary: Remove your own fields for a person
      description: Audited as contact_delete. Requires admin.
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contacts/import:
    post:
      tags: [Contacts]
      summary: Import your own contact list from a CSV
      description: |
        Header line naming the columns (number required, also as to or phone; name, tags, notes, language, time_zone;
        any order and case; "," or ";" between fields), then one person per line. A column present overwrites that
        field (an empty cell clears it); absent columns are left alone. Numbers are never looked up. One transaction:
        any bad line is a 400 naming it and nothing is stored. Audited as contact_import. Requires admin.
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean }, description: "Check and count without storing" }
        - { name: add_tags, in: query, schema: { type: string }, description: "Tags added to every row (comma-separated)" }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, description: "At most 5000 rows and 4 MB" }
            example: "number,name,tags,notes\n5511999999999,Maria,clients vip,\n5511988887777,John,clients,\"prefers mornings\"\n"
      responses:
        "200": { description: Counts, content: { application/json: { schema: { $ref: "#/components/schemas/ImportResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: "The body is over 4 MB" }

  /contacts/export:
    get:
      tags: [Contacts]
      summary: Your own contact list as a CSV
      description: The import's columns (number, name, tags, notes, language, time_zone), so a round trip is lossless. Holds your notes. Audited as contact_export. Requires admin.
      responses:
        "200": { description: The CSV, content: { text/csv: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /groups:
    get:
      tags: [Directory]
      summary: Groups you're in
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    jid: { type: string, example: "120363012345678901@g.us" }
                    name: { type: string, example: "Family" }
                    members: { type: integer, example: 12 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /check:
    post:
      tags: [Directory]
      summary: Which phone numbers have WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phones]
              properties:
                phones:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string }
                  example: ["+5511999999999", "15551234567"]
      responses:
        "200":
          description: One result per number
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    query: { type: string }
                    on_whatsapp: { type: boolean }
                    jid: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /audit:
    get:
      tags: [Admin]
      summary: Control actions, newest first
      description: Sends, files, reactions, edits, deletes (every attempt, including ones rejected for bad input), read receipts, pairing and logout. Message text is never stored.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: before, in: query, description: "Only entries with a lower id (cursor).", schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /queue:
    post:
      tags: [Queue]
      summary: Queue texts for paced sending
      description: |
        Stores up to 1000 texts and answers at once; a worker sends them within the rate limits, retrying
        and backing off on errors, and keeps going after a restart. Top-level text and send_at apply to
        messages that leave theirs out. Tokens limited to chats can only queue to those. See docs/QUEUE.md.
        Requires send.

        A to of tag:NAME queues one item per person with that contact tag (needs read too; members
        outside a restricted token's allowlist are dropped without a trace; an empty tag is a 400).
        template fills {name}, {first_name} and {push_name} ({name|fallback}; {{ and }} for braces)
        per recipient, never with a push name for {name} (needs read). dedupe skips a row whose
        recipient and text appeared earlier in the request; skip_sent skips recipients who already
        got a message: a duration ("48h", "3d", at most 90 days, 7 without read) or "batch:NAME".
        Skipped rows are counted in skipped and listed in skipped_rows; all of them skipped is
        still a 202.

        With Content-Type text/csv (or application/csv), the body is a CSV file: a header line naming
        the columns (to required; text, send_at, reply_to, name; any order and case; "," or ";"
        between fields) and one message per line; batch, send_at, text, template, dedupe and
        skip_sent come from the query. Unknown columns are refused, and errors name the line
        ("line 7: invalid recipient"). Prefer a text column to the text query parameter, which
        proxies and shell history may log.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - { name: batch, in: query, description: "CSV body only: the batch", schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" } }
        - { name: text, in: query, description: "CSV body only: text for rows without one. Query strings get logged by proxies; prefer a text column", schema: { type: string } }
        - { name: send_at, in: query, description: "CSV body only: earliest send time for rows without one", schema: { type: string, format: date-time } }
        - { name: template, in: query, description: "CSV body only: fill {name} placeholders (1, true, 0 or false)", schema: { type: boolean } }
        - { name: dedupe, in: query, description: "CSV body only: skip repeated rows (1, true, 0 or false)", schema: { type: boolean } }
        - { name: skip_sent, in: query, description: "CSV body only: skip recipients messaged within this duration, or in batch:NAME", schema: { type: string, example: "48h" } }
        - { name: file, in: query, description: "CSV body only: id of a file from POST /queue/files, the default for every row", schema: { type: string, pattern: "^f_[0-9a-f]{32}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                batch: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$", description: "Groups the items; generated when left out" }
                text: { type: string, description: "Default text" }
                send_at: { type: string, format: date-time, description: "Default earliest send time, up to 30 days ahead" }
                idempotency_key: { type: string }
                template: { type: boolean, description: "Fill {name}, {first_name} and {push_name} per recipient (needs read)" }
                dedupe: { type: boolean, description: "Skip a row whose recipient, file and text appeared earlier in the request" }
                skip_sent: { type: string, description: "Skip recipients who got a message within this duration (at most 90d; 7d without read), or batch:NAME", example: "48h" }
                file: { type: string, pattern: "^f_[0-9a-f]{32}$", description: "Default file (id from POST /queue/files, the caller's own); text becomes its caption and may be empty" }
                messages:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [to]
                    properties:
                      to: { type: string, example: "5511999999999", description: "Number, JID, or tag:NAME (needs read)" }
                      text: { type: string }
                      reply_to: { type: string }
                      send_at: { type: string, format: date-time }
                      name: { type: string, description: "The {name} for this message's template; wins over every known name" }
                      file: { type: string, pattern: "^f_[0-9a-f]{32}$", description: "File for this message; overrides the top-level one" }
            example: { batch: promo-october, text: "Hi! Our store opens at 9 tomorrow.", messages: [{ to: "5511999999999" }, { to: "5511988887777", text: "Hi John!" }] }
          text/csv:
            schema: { type: string, description: "Header line, then one message per line; at most 1000 rows and 16 MB" }
            example: "to,text,send_at\n5511999999999,\"Hi Maria, your order is ready.\",\n5511988887777,Hi John!,2026-10-13T09:00:00-03:00\n"
          application/csv:
            schema: { type: string, description: "Same as text/csv" }
      responses:
        "202":
          description: Queued (or, for a repeated idempotency key, the items queued the first time)
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch: { type: string }
                  queued: { type: integer, description: "How many items the answer has" }
                  replayed: { type: integer, description: "How many of them were already queued under this idempotency key" }
                  items: { type: array, items: { $ref: "#/components/schemas/OutboxItem" } }
                  skipped:
                    type: object
                    properties:
                      duplicate: { type: integer }
                      recently_sent: { type: integer }
                  skipped_rows:
                    type: array
                    description: The first 100 skipped rows
                    items:
                      type: object
                      properties:
                        line: { type: integer, description: "CSV line (CSV bodies only)" }
                        index: { type: integer, description: "Index of the row in the request" }
                        to: { type: string, description: "The recipient (a tag's member for a tag row)" }
                        reason: { type: string, enum: [duplicate, recently_sent] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "A file id isn't one of the caller's live files (also another token's file); nothing is queued" }
        "409": { description: "The idempotency key was used for a different request (to, text, reply_to, send_at, file or a named batch differ); nothing is queued" }
        "413": { description: "The body is over 16 MB" }
    get:
      tags: [Queue]
      summary: Queued, sent and failed items
      description: Newest first, with counts by state. Without admin, only the caller's own items. Requires send.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, sending, sent, failed, canceled] } }
        - { name: batch, in: query, schema: { type: string } }
        - { name: actor, in: query, description: "Admin only: one token's items", schema: { type: string } }
        - { name: before, in: query, description: "Only ids lower than this, to page back", schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200":
          description: Items and counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OutboxItem" } }
                  counts: { $ref: "#/components/schemas/QueueCounts" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Queue]
      summary: Cancel a batch
      description: Cancels every still-queued item of the batch (the caller's own unless admin). Requires send.
      parameters:
        - { name: batch, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Canceled, content: { application/json: { schema: { type: object, properties: { canceled: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /queue/files:
    post:
      tags: [Queue]
      summary: Upload a file to queue
      description: |
        Uploads an image or document once, to be referenced by id from POST /queue (docs/QUEUE.md). One
        multipart part named file, streamed to disk, up to 64 MB. The type is read from the bytes, never from
        the client's Content-Type: JPEG, PNG and WebP as images; PDF, plain text, CSV, .docx .xlsx .pptx
        .odt .ods .odp as documents. Anything else is 415, text starting with "<" too, and the file name's
        extension must match the content (text must be UTF-8; Office archives hold at most 10,000 entries). Two uploads per token and eight in all at once, else 429. Images over 16 MB, or over 16384 px a side or 100 MP, go as
        documents. A file belongs to the token that uploaded it, sits on the server's disk until sent and
        is never served back. Quotas: 50 files and 500 MB per token, and queue_files_quota in all.
        201 for a new file, 200 when the caller already has a live file with the same sha256.
        Requires send.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: The caller already had this file (same sha256)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueFile" }
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: "Over 64 MB, or over a quota (the message says which one)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: "The content isn't an allowed type, or the name's extension doesn't match it", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "507": { description: "The server couldn't write the file", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      tags: [Queue]
      summary: Uploaded queue files
      description: |
        The caller's live files and their usage. Admin sees every actor's files, without the other actors'
        name, and usage is the total. Never returns content. Requires send.
      responses:
        "200":
          description: Files and usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  files: { type: array, items: { $ref: "#/components/schemas/QueueFile" } }
                  usage:
                    type: object
                    properties:
                      files: { type: integer }
                      bytes: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /queue/files/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^f_[0-9a-f]{32}$" } }
    delete:
      tags: [Queue]
      summary: Delete a queue file
      description: "The caller's own file (admin: any). Requires send."
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Unknown id, or another token's file (404 rather than 403, so ids don't leak)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "Queued or sending items use it; cancel them first", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /queue/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Queue]
      summary: One queued item, with its text
      description: Requires send; without admin, only the caller's own items.
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboxItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Queue]
      summary: Cancel a queued item
      description: Only items still queued; 409 once one is sending or finished. Requires send.
      responses:
        "200": { description: Canceled, content: { application/json: { schema: { type: object, properties: { canceled: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already sending or finished", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /optouts:
    get:
      tags: [Queue]
      summary: Chats that get no queued messages
      description: |
        A person is added when they send a 1:1 message that is only STOP, SAIR, PARAR, CANCELAR, UNSUBSCRIBE
        or DESCADASTRAR (case and accents ignored); wame doesn't reply. Queued items to a listed chat fail with
        "recipient opted out" when their turn comes. Direct sends aren't affected. Newest first. Requires admin.
      responses:
        "200":
          description: The list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OptOut" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Queue]
      summary: Add a chat to the opt-out list
      description: Takes a number or a person's JID (numbers are checked with WhatsApp when logged in). Audited as optout_add. Requires admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat]
              properties:
                chat: { type: string, example: "5511999999999" }
      responses:
        "200": { description: Already listed, content: { application/json: { schema: { $ref: "#/components/schemas/OptOutResult" } } } }
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/OptOutResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /optouts/{chat}:
    parameters:
      - { name: chat, in: path, required: true, schema: { type: string }, description: "Number or JID" }
    delete:
      tags: [Queue]
      summary: Take a chat off the opt-out list
      description: Audited as optout_remove. Requires admin.
      responses:
        "200": { description: Removed, content: { application/json: { schema: { type: object, properties: { removed: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stats:
    get:
      tags: [Admin]
      summary: Limiter, webhook, queue and alert health
      description: Version and start time, a snapshot of the send, lookup and auto-reply limiters (use in the last minute, rejections since startup), webhook delivery counters with the latest failures, the send queue and the alerter. Counters live in memory and reset on restart. Never includes the webhook URL, its secret, the Gotify URL or token, or message content. Requires admin.
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /logs:
    get:
      tags: [Admin]
      summary: Recent app logs
      description: |
        The newest app (slog) log records, newest first, kept in memory (the last 1000, at the server's
        log level) until restart. whatsmeow's own logs aren't included. Message text is never logged;
        attributes whose key looks secret (token, secret, password, authorization, cookie, key, url,
        webhook) are "[redacted]", and the owner secret, webhook URL and webhook secret are replaced
        wherever they appear. Requires admin.
      parameters:
        - { name: level, in: query, description: "Lowest level returned.", schema: { type: string, enum: [debug, info, warn, error], default: debug } }
        - { name: since, in: query, description: "Only entries with a higher id (tailing).", schema: { type: integer, format: int64 } }
        - { name: before, in: query, description: "Only entries with a lower id (paging back).", schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settings:
    get:
      tags: [Admin]
      summary: Runtime settings
      description: The settings an admin can change without a restart, with their effective value, the flag's value and who changed them. Requires admin.
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SettingView" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Admin]
      summary: Change runtime settings
      description: |
        Applies at once and is kept in the database, so it also wins over the flags on the next start.
        Values may be strings, numbers or booleans; null goes back to the flag's value. Every change is
        validated before any is applied, and the change is audited (action settings). Requires admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rate: { nullable: true, description: "Sends per minute, 0 = unlimited, up to 1000. Number lookups follow at 3x" }
                chat_gap: { type: string, nullable: true, description: "Duration between two sends to one chat, up to 10m" }
                max_wait: { type: string, nullable: true, description: "How long a send may queue before a 429, up to 10m" }
                auto_reply: { nullable: true, description: "true or false" }
                webhook_filter: { type: string, nullable: true, description: "Same syntax as -webhook-filter; only has an effect with -webhook" }
                queue_paused: { nullable: true, description: "true holds the send queue" }
                queue_jitter: { type: string, nullable: true, description: "Random extra wait between queued sends, up to 10m" }
                queue_quiet_hours: { type: string, nullable: true, description: "Daily window when the queue sends nothing, like 21:00-08:00 (may cross midnight); empty turns it off" }
                queue_quiet: { nullable: true, description: "false switches the quiet hours off without forgetting the window; true or null turns them back on" }
                queue_timezone: { type: string, nullable: true, description: "IANA zone the quiet hours are read in, like America/Sao_Paulo; Local is the server's zone" }
                queue_media_ttl: { type: string, nullable: true, description: "How long one upload to WhatsApp is reused for later messages with the same queue file: a duration up to 168h (default 24h), or off to upload for every message" }
                queue_files_quota: { type: string, nullable: true, description: "Bytes all queue files may take together: 2GB (default), 500MB, 64KB, 1TB or a byte count, powers of 1024; 0 refuses new uploads" }
            example: { rate: 10, auto_reply: false, chat_gap: null }
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SettingView" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /metrics:
    get:
      tags: [Admin]
      summary: Prometheus metrics
      description: |
        Prometheus text exposition format 0.0.4: connection state, build info, uptime, sends by result,
        limiter use and rejections, webhook and alert counters, send queue items by state and open
        streams. No per-token series. Requires admin (configure Prometheus with an authorization
        Bearer token).
      responses:
        "200":
          description: Metrics
          content:
            text/plain:
              schema: { type: string }
              example: |
                # HELP wame_connected 1 while connected to WhatsApp.
                # TYPE wame_connected gauge
                wame_connected 1
                # HELP wame_sends_total Messages and files sent since startup, by result.
                # TYPE wame_sends_total counter
                wame_sends_total{result="ok"} 42
                wame_sends_total{result="failed"} 1
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /alerts/test:
    post:
      tags: [Admin]
      summary: Send a test alert
      description: Sends a low-priority test alert through the configured backend (Gotify). Audited as alert_test. Requires admin.
      responses:
        "200":
          description: Gotify accepted it
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: "Gotify refused the alert or couldn't be reached; the error never contains its address or token", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /webhook/test:
    post:
      tags: [Admin]
      summary: Send a test delivery
      description: Posts a signed event of type test (X-Wame-Event test) with a small JSON body and no message, once, and reports how the receiver answered. Audited as webhook_test; not counted in /stats. Requires admin.
      responses:
        "200":
          description: The attempt, whether or not the receiver accepted it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /webhook/replay:
    post:
      tags: [Admin]
      summary: Send a failed delivery again
      description: Sends one of the recent failures from /stats again, once, with the same X-Wame-Delivery id, rebuilding the body from the stored message as it is now. Other ids are refused. Audited as webhook_replay. Requires admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery]
              properties:
                delivery: { type: string, example: "4711-message-a1b2c3d4" }
      responses:
        "200":
          description: The attempt, whether or not the receiver accepted it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tokens:
    get:
      tags: [Tokens]
      summary: List API tokens
      description: Every token, oldest first, including revoked and expired ones. Secrets and hashes are never returned. Requires admin.
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tokens]
      summary: Create an API token
      description: |
        Requires admin. The plaintext token is returned once. When the caller is itself a token, it can't create
        `admin` tokens (403), and the new token records `created_by`, can't expire after the caller and is revoked
        with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,39}$", example: "support-bot", description: "Unique forever; api, owner, local, mcp, tui, cli, autoreply, whatsapp, relink are reserved" }
                scopes:
                  type: array
                  items: { type: string, enum: [read, send, admin] }
                  example: [read, send]
                chats:
                  type: array
                  items: { type: string }
                  description: Phone numbers or JIDs the token is limited to; empty means all chats. Not allowed with admin.
                  example: ["5511999999999"]
                rate: { type: integer, minimum: 0, description: "Sends per minute for this token. Omitted = 10; 0 = global limit only" }
                expires_in: { type: string, description: "Go duration, e.g. 720h. Omitted = never", example: "720h" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "wame_k3x7q2ma_…", description: "Shown only now" }
                  details: { $ref: "#/components/schemas/Token" }
                  note: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tokens/{name}:
    delete:
      tags: [Tokens]
      summary: Revoke a token
      description: Revokes the token and every token it created, recursively. Open streams using them close within 10 s. Requires admin.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Number of tokens revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer, example: 2 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /docs:
    get:
      tags: [Docs]
      summary: This Swagger UI page
      description: Loads swagger-ui-dist from jsDelivr with Subresource Integrity (sha384) hashes.
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema: { type: string }

  /openapi.yaml:
    get:
      tags: [Docs]
      summary: This OpenAPI spec
      security: []
      responses:
        "200":
          description: YAML
          content:
            application/yaml:
              schema: { type: string }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        An API token (`wame_<id>_<secret>`) or the owner secret. Scopes: `read` (status, chats, messages,
        events, media, contacts, groups), `send` (send, file, react, edit, delete, read receipts, typing,
        check), `admin` (everything, incl. qr/pair/logout, audit and tokens). Tokens may be limited to a
        chat allowlist and have their own send rate (default 10/min).

  parameters:
    Chat:
      name: chat
      in: query
      description: "Phone number or JID; matches the chat or the sender."
      schema: { type: string, example: "5511999999999" }
    Type:
      name: type
      in: query
      description: "Comma-separated message types, e.g. text,image."
      schema: { type: string, example: "text,image" }
    FromMe:
      name: from_me
      in: query
      schema: { type: boolean }
    IsGroup:
      name: is_group
      in: query
      schema: { type: boolean }
    Since:
      name: since
      in: query
      description: "Only messages with a higher seq."
      schema: { type: integer, format: int64, minimum: 0 }
    Q:
      name: q
      in: query
      description: |
        Text search. Every word must match a whole word of the message text, the last one as a prefix
        ("bom di" finds "bom dia"). Case and accents are ignored ("cafe" finds "café"). Deleted messages
        aren't found; edited messages are found by their current text.
      schema: { type: string, example: "bom dia" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: "A repeat of the same request with the same key within 24 h returns the first result instead of sending again; the same key with a different request is a 409. Failures aren't cached. Max 200 characters."
      schema: { type: string, maxLength: 200, example: "order-1234-shipped" }

  responses:
    OK:
      description: Done
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: true }
    MessageResult:
      description: The resulting message
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    BadRequest:
      description: Bad input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or wrong token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        The token lacks the route's scope, or is limited to chats and the request is outside them
        ("this token can't access that chat") or uses an endpoint not available to restricted tokens;
        in token-less mode, the request isn't a same-origin request over loopback.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The idempotency key was already used for a different request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "idempotency key was already used for a different request" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: The send would have to wait longer than -max-wait
      headers:
        Retry-After:
          description: Seconds until a retry can succeed
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: WhatsApp rejected or failed the request, or not logged in
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Timeout:
      description: Timed out or cancelled
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: "not logged in" }
    Status:
      type: object
      properties:
        connected: { type: boolean }
        logged_in: { type: boolean }
        jid: { type: string, example: "5511988887777@s.whatsapp.net" }
        push_name: { type: string }
        qr: { type: string, description: "Raw QR data while waiting for a scan" }
        state:
          type: string
          example: connected
          description: "starting, connecting, waiting_for_qr_scan, paired, connected, disconnected, qr_timeout, logged_out, login_error: …"
    Media:
      type: object
      properties:
        mimetype: { type: string, example: "image/jpeg" }
        file_name: { type: string, description: "Documents only" }
        size: { type: integer, format: int64, example: 183204 }
        path: { type: string, description: "Download path relative to the API base", example: "/media/1042" }
    Message:
      type: object
      properties:
        seq: { type: integer, format: int64, description: "Monotonic cursor assigned when stored", example: 1042 }
        id: { type: string, example: "3EB0C767D26A1D0F5E2A" }
        chat: { type: string, example: "5511999999999@s.whatsapp.net" }
        sender: { type: string, example: "5511999999999@s.whatsapp.net" }
        push_name: { type: string, example: "Maria" }
        from_me: { type: boolean }
        is_group: { type: boolean }
        type: { type: string, enum: [text, image, video, document, audio, sticker, reaction, location], description: "video includes round video notes" }
        text: { type: string, description: "Body, caption, file name for documents, emoji for reactions; empty after delete" }
        reply_to: { type: string, description: "Quoted message id, or the target of a reaction" }
        media: { $ref: "#/components/schemas/Media" }
        edited: { type: boolean }
        deleted: { type: boolean }
        timestamp: { type: string, format: date-time }
    Chat:
      type: object
      properties:
        jid: { type: string }
        name: { type: string, description: "Contact or group name; ~Name is the person's WhatsApp profile name" }
        is_group: { type: boolean }
        last_text: { type: string }
        last_type: { type: string }
        last_from_me: { type: boolean }
        last_at: { type: string, format: date-time }
        unread:
          type: integer
          description: >-
            Incoming messages (not reactions, not deleted) after the chat's read position. The position moves when
            you send in the chat, open it in the TUI, call /read, or read it on another device.
          example: 2
    Contact:
      type: object
      properties:
        jid: { type: string, example: "5511999999999@s.whatsapp.net" }
        phone: { type: string, example: "+5511999999999", description: "Empty for a person known only by a hidden @lid id" }
        name: { type: string, description: "The one name every view shows", example: "Maria" }
        name_source: { type: string, enum: [own, book, business, push, number] }
        own_name: { type: string, description: "Your own name for them, when set" }
        book_name: { type: string, description: "The phone's address-book name, when known" }
        business_name: { type: string }
        push_name: { type: string, description: "The name they set in WhatsApp" }
        tags: { type: array, items: { type: string }, example: [clients, vip] }
    ContactView:
      allOf:
        - $ref: "#/components/schemas/Contact"
        - type: object
          properties:
            own:
              description: Your own fields; admin only, absent when you wrote nothing about them
              allOf: [{ $ref: "#/components/schemas/OwnContact" }]
    ContactProfile:
      type: object
      description: |
        One person. The basic view (read scope, or any token limited to chats) has jid, phone, lid, names,
        own.tags and whatsapp.on_whatsapp / stale; everything else is the full view (an unrestricted admin token).
      properties:
        jid: { type: string, example: "5511988887777@s.whatsapp.net" }
        phone: { type: string, example: "+5511988887777" }
        lid: { type: string, example: "100000000000001@lid", description: "The person's hidden WhatsApp id when wame's LID map knows it, else an empty string" }
        names:
          type: object
          properties:
            name: { type: string, description: "The one name every view shows", example: John }
            name_source: { type: string, enum: [own, book, business, push, number] }
            own_name: { type: string }
            book_name: { type: string }
            business_name: { type: string }
            push_name: { type: string }
        own:
          type: object
          properties:
            tags: { type: array, items: { type: string }, example: [clients] }
            notes: { type: string, description: "Full view only" }
            language: { type: string, example: en, description: "Full view only" }
            time_zone: { type: string, example: America/New_York, description: "Full view only" }
            created_at: { type: string, format: date-time }
            created_by: { type: string }
            updated_at: { type: string, format: date-time }
            updated_by: { type: string }
        whatsapp:
          type: object
          properties:
            on_whatsapp: { type: boolean, nullable: true, description: "null when unknown" }
            about: { type: string, description: "Full view only" }
            about_at: { type: string, format: date-time, description: "Full view only" }
            verified_name: { type: string, description: "Full view only" }
            verified_level: { type: string, description: "Full view only" }
            picture:
              type: object
              properties:
                id: { type: string }
                url: { type: string, description: "Signed CDN link, dropped after 6 hours" }
                hidden: { type: boolean }
                as_of: { type: string, format: date-time }
            business:
              type: object
              properties:
                address: { type: string }
                email: { type: string }
                categories: { type: array, items: { type: string } }
                options: { type: object, additionalProperties: { type: string } }
                time_zone: { type: string }
                as_of: { type: string, format: date-time }
            as_of: { type: string, format: date-time, description: "Full view only" }
            stale: { type: boolean, description: "In every view: a part is older than its limit, or was never fetched" }
            error: { type: string, description: "The last WhatsApp error, full view only" }
            error_at: { type: string, format: date-time }
        activity:
          type: object
          description: Full view only
          properties:
            first_at: { type: string, format: date-time }
            last_at: { type: string, format: date-time }
            sent: { type: integer }
            received: { type: integer }
            unread: { type: integer }
            groups_in_common:
              type: array
              items:
                type: object
                properties:
                  jid: { type: string, example: "120363000000000001@g.us" }
                  name: { type: string, example: Team }
        queue:
          type: object
          description: Full view only; the person's queue items in the last 7 days
          properties:
            window: { type: string, example: 7d }
            total: { type: integer }
            open: { type: integer }
            sent: { type: integer }
            delivered: { type: integer }
            read: { type: integer }
            failed: { type: integer }
            last_at: { type: string, format: date-time }
        opted_out: { type: boolean, description: "Full view only" }
        tokens:
          type: array
          items: { type: string }
          description: "Full view only: names of usable tokens whose chat list names this person"
        refreshed: { type: boolean, description: "Only with refresh=1; false when the cache was returned or WhatsApp answered with an error" }
        next_refresh_at: { type: string, format: date-time, description: "Only with refresh=1" }
    OwnContact:
      type: object
      properties:
        jid: { type: string }
        name: { type: string }
        tags: { type: array, items: { type: string } }
        notes: { type: string }
        language: { type: string, example: pt-BR }
        time_zone: { type: string, example: America/Sao_Paulo }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    ContactInput:
      type: object
      additionalProperties: false
      description: In a PUT a field left out is cleared; in a PATCH it's left alone, and null or "" clears it.
      properties:
        name: { type: string, nullable: true, maxLength: 100 }
        tags: { type: array, nullable: true, maxItems: 20, items: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,31}$" } }
        notes: { type: string, nullable: true, maxLength: 2000 }
        language: { type: string, nullable: true, maxLength: 16, example: pt-BR }
        time_zone: { type: string, nullable: true, maxLength: 64, example: America/Sao_Paulo }
        add_tags: { type: array, items: { type: string }, description: "PATCH only" }
        remove_tags: { type: array, items: { type: string }, description: "PATCH only" }
    ImportResult:
      type: object
      properties:
        added: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
    TagCount:
      type: object
      properties:
        tag: { type: string, example: clients }
        count: { type: integer, example: 12 }
    Token:
      type: object
      description: An API token as stored. The secret and its hash are never returned.
      properties:
        id: { type: string, example: "k3x7q2ma" }
        name: { type: string, example: "support-bot" }
        scopes:
          type: array
          items: { type: string, enum: [read, send, admin] }
        chats:
          type: array
          items: { type: string }
          description: Allowlist (JIDs); omitted means every chat
        rate: { type: integer, description: "Per-token sends per minute; omitted means global limit only" }
        created: { type: string, format: date-time }
        expires: { type: string, format: date-time, description: "Omitted when the token never expires" }
        last_used: { type: string, format: date-time }
        revoked: { type: boolean }
        created_by: { type: string, description: "Name of the token that created this one over the API; omitted for the CLI or owner" }
    LimiterStats:
      type: object
      properties:
        per_minute: { type: integer, description: "0 = unlimited" }
        chat_gap_ms: { type: integer }
        max_wait_ms: { type: integer }
        last_minute: { type: integer, description: "Slots reserved in the last minute, including sends still waiting to go out" }
        next_free: { type: string, format: date-time, description: "When the per-minute budget frees up; absent when it isn't used up" }
        rejected: { type: integer, description: "429s (or dropped auto-replies) since startup" }
        last_rejected: { type: string, format: date-time }
    WebhookFailure:
      type: object
      properties:
        at: { type: string, format: date-time }
        delivery: { type: string, description: "Same as the X-Wame-Delivery header" }
        event: { type: string, enum: [message, update] }
        attempt: { type: integer }
        status: { type: integer, description: "HTTP status, absent when the request itself failed" }
        error: { type: string }
        gave_up: { type: boolean, description: "No more retries for this delivery" }
        replayed: { type: boolean, description: "Sent again successfully with POST /webhook/replay" }
    LogEntry:
      type: object
      required: [id, time, level, msg]
      properties:
        id: { type: integer, format: int64, description: "Grows by one per record, across levels" }
        time: { type: string, format: date-time }
        level: { type: string, description: "debug, info, warn or error" }
        msg: { type: string }
        attrs:
          type: object
          additionalProperties: { type: string }
          description: Attributes as strings; groups become dotted keys. Secret-looking ones are "[redacted]".
    Stats:
      type: object
      properties:
        version: { type: string }
        started: { type: string, format: date-time }
        auto_reply: { type: boolean }
        limits:
          type: object
          properties:
            send: { $ref: "#/components/schemas/LimiterStats" }
            lookups: { $ref: "#/components/schemas/LimiterStats" }
            auto_reply: { $ref: "#/components/schemas/LimiterStats" }
        webhook:
          nullable: true
          description: null when no webhook is configured
          type: object
          properties:
            queued: { type: integer }
            capacity: { type: integer }
            delivered: { type: integer }
            retried: { type: integer, description: "Delivered after more than one attempt" }
            failed: { type: integer, description: "Given up after retries or a non-retryable answer" }
            dropped: { type: integer, description: "Queue was full" }
            replayed: { type: integer, description: "Failed deliveries sent again with POST /webhook/replay that succeeded" }
            last_success: { type: string, format: date-time }
            last_failure: { type: string, format: date-time }
            recent_failures:
              type: array
              description: Up to 20, newest first
              items: { $ref: "#/components/schemas/WebhookFailure" }
        queue:
          allOf:
            - $ref: "#/components/schemas/QueueCounts"
            - type: object
              properties:
                paused: { type: boolean }
                running: { type: boolean, description: "A worker runs in this process (serve or tui)" }
                jitter_ms: { type: integer }
                quiet_hours: { type: string, description: "The queue_quiet_hours window, absent when off", example: "21:00-08:00" }
                timezone: { type: string, description: "The zone quiet hours are read in", example: "America/Sao_Paulo" }
                quiet_until: { type: string, format: date-time, description: "Present while quiet hours hold the queue" }
                quiet_off: { type: boolean, description: "The window is set but switched off (queue_quiet false)" }
                cooldown_until: { type: string, format: date-time, description: "Backing off after repeated WhatsApp errors" }
                last_error: { type: string }
                last_error_at: { type: string, format: date-time }
                files: { type: integer, description: "Live queue files" }
                file_bytes: { type: integer, format: int64, description: "Bytes those files take on disk" }
                files_quota: { type: integer, format: int64, description: "The queue_files_quota limit in bytes" }
        alerts:
          type: object
          description: Push alerts (-alert-gotify). Never includes the URL or the token
          properties:
            configured: { type: boolean }
            backend: { type: string, example: gotify }
            delay_ms: { type: integer, description: "How long a disconnection lasts before it alerts" }
            sent: { type: integer }
            failed: { type: integer }
            last_sent: { type: string, format: date-time }
            last_title: { type: string, example: "wame: WhatsApp is back" }
            last_error: { type: string, description: "The Gotify address is replaced by gotify" }
            last_error_at: { type: string, format: date-time }
        callers:
          type: array
          description: Everyone who called the API or /mcp since startup, by token name; in memory, last 24 hours
          items: { $ref: "#/components/schemas/CallerStats" }
    OutboxItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        batch: { type: string }
        actor: { type: string, description: "Token name that queued it" }
        to: { type: string }
        text: { type: string, description: "Only in GET /queue and GET /queue/{id}" }
        reply_to: { type: string }
        status: { type: string, enum: [queued, sending, sent, failed, canceled] }
        attempts: { type: integer }
        due: { type: string, format: date-time, description: "Earliest time it may go out" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        chat: { type: string, description: "The chat it went to, once sent" }
        message_id: { type: string, description: "WhatsApp message id, the same on every attempt" }
        error: { type: string, description: "Last error" }
        delivered_at: { type: string, format: date-time, description: "When WhatsApp reported it delivered; absent until then" }
        read_at: { type: string, format: date-time, description: "When WhatsApp reported it read; absent until then (or if the person hides read receipts)" }
        file: { type: string, description: "Queue file id; absent for text. Never the file's name" }
        kind: { type: string, enum: [image, document], description: "Absent for text" }
        file_size: { type: integer, format: int64, description: "Bytes of the file; absent for text" }
    QueueFile:
      type: object
      description: A file uploaded for the queue. Never its content.
      properties:
        id: { type: string, example: "f_0123456789abcdef0123456789abcdef" }
        actor: { type: string, description: "Token name that uploaded it" }
        sha256: { type: string }
        size: { type: integer, format: int64 }
        mime: { type: string, description: "Sniffed from the bytes", example: application/pdf }
        kind: { type: string, enum: [image, document] }
        name: { type: string, description: "Display name only (cleaned); left out of other actors' files in the admin's listing" }
        created_at: { type: string, format: date-time }
        items: { type: integer, description: "Queue items that use the file" }
        open: { type: integer, description: "Of those, how many are still queued or sending" }
        expires_at: { type: string, format: date-time, description: "Only while no item has used the file yet: when it is deleted if still unused (24 h after upload)" }
    QueueCounts:
      type: object
      properties:
        queued: { type: integer }
        sending: { type: integer }
        sent: { type: integer }
        failed: { type: integer }
        canceled: { type: integer }
        delivered: { type: integer, description: "Sent items WhatsApp reported delivered (read ones included)" }
        read: { type: integer, description: "Sent items WhatsApp reported read" }
        oldest_queued: { type: string, format: date-time }
        next_due: { type: string, format: date-time }
    OptOut:
      type: object
      properties:
        chat: { type: string, example: "5511999999999@s.whatsapp.net" }
        reason: { type: string, description: "The keyword the person sent (STOP, SAIR, PARAR, CANCELAR, UNSUBSCRIBE, DESCADASTRAR), or manual" }
        at: { type: string, format: date-time }
        by: { type: string, description: "whatsapp, or the token name that added it" }
    OptOutResult:
      type: object
      properties:
        chat: { type: string, description: "The chat key it's stored under" }
        added: { type: boolean }
    CallerStats:
      type: object
      properties:
        name: { type: string, description: "Token name, or api for the owner secret" }
        requests_24h: { type: integer }
        sends_24h: { type: integer, description: "Texts and files sent successfully" }
        failed_sends_24h: { type: integer }
        last_seen: { type: string, format: date-time }
        last_ip: { type: string }
        open_streams: { type: integer, description: "Open /events and /messages/wait connections" }
    SettingView:
      type: object
      properties:
        key: { type: string, enum: [rate, chat_gap, max_wait, auto_reply, webhook_filter, queue_paused, queue_jitter, queue_quiet_hours, queue_quiet, queue_timezone, queue_media_ttl, queue_files_quota] }
        value: { type: string, description: "Effective value" }
        default: { type: string, description: "The flag's value, used when not overridden" }
        overridden: { type: boolean }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
    WebhookResult:
      type: object
      properties:
        delivery: { type: string }
        status: { type: integer, description: "The receiver's HTTP status, absent when the request failed" }
        duration_ms: { type: integer }
        ok: { type: boolean }
        error: { type: string }
    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string, description: "Token name for API/MCP calls (api = owner secret or token-less, mcp = stdio without a token), or tui, cli, autoreply, whatsapp", example: "support-bot" }
        action: { type: string, enum: [send, send_file, react, edit, delete, read, pair, logout, logged_out, qr, check, token_create, token_revoke, settings, webhook_test, webhook_replay, queue, queue_cancel, queue_file, queue_file_delete, queue_files_wipe, optout_add, optout_remove, alert_test, contact_set, contact_delete, contact_import, contact_delete_all, contact_export, contact_refresh, contacts_wipe] }
        target: { type: string, description: "Chat JID, when there is one" }
        detail: { type: string, example: "text, 6 chars" }
        ok: { type: boolean }
        error: { type: string }
