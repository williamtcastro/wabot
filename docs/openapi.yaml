openapi: 3.0.3
info:
  title: wabot HTTP API
  version: "2.0"
  description: |
    A small WhatsApp bot built on [whatsmeow](https://github.com/tulir/whatsmeow).

    **Auth:** send `Authorization: Bearer <token>` with an API token (`wabot_…`, from `wabot token create`
    or `POST /tokens`) or the owner secret (`WABOT_TOKEN`, at least 16 characters). Click **Authorize**
    above to set it for the "Try it out" buttons. `?token=` is accepted only on `GET /events`, `GET /qr`
    and `GET /media/{seq}`. Every route needs a scope (`read`, `send` or `admin`; admin implies all), and
    tokens limited to chats only see and act on those chats. Before any token was ever created and without
    an owner secret, the API runs token-less: loopback connections to a loopback `Host`, same-origin only;
    anything else gets 403. After 10 failed logins in a minute an IP gets 429 for a minute.

    **MCP:** `/mcp` serves the Model Context Protocol (streamable HTTP) for AI agents with the same tokens.
    It isn't described here; see docs/MCP.md.

    **Recipients** (`to`, `chat`): a phone number with country code in any format
    (`5511999999999`, `+55 (11) 99999-9999`) or a full JID (`…@s.whatsapp.net`, `…@g.us`, `…@lid`).
    Phone numbers are looked up on WhatsApp first, so variants like Brazil's 9th digit just work.
    A number that isn't on WhatsApp is a 400.

    **Rate limiting:** everything that sends a message (text, file, reaction, edit, delete) is spaced out
    by the server (`-rate`, `-chat-gap`). A request waits for its slot up to `-max-wait`; beyond that it gets
    429 with `Retry-After`. Number lookups (uncached phone numbers, `/check`, `/typing`) have a separate
    limit of 3 × `-rate` per minute with the same 429 behaviour.

    **Errors** are always `{"error": "..."}`: 400 bad input, 401 missing/invalid/revoked/expired token,
    403 missing scope or chat outside the token's allowlist (or not local in token-less mode), 404 not found,
    409 idempotency key reused for a different request, 410 media expired,
    429 rate limited, 502 WhatsApp failure or not logged in, 504 timeout.
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: Session
  - name: Messaging
  - name: Reading
  - name: Directory
  - name: Admin
  - name: Tokens
  - name: Docs

paths:
  /status:
    get:
      tags: [Session]
      summary: Connection and login state
      description: "`qr` is shown to admin callers only; `jid` and `push_name` are hidden from tokens limited to chats."
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /qr:
    get:
      tags: [Session]
      summary: Login QR code as PNG
      description: Only available while not logged in. Codes rotate about every 20 s; a new round starts by itself when they run out.
      responses:
        "200":
          description: QR image
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /pair:
    post:
      tags: [Session]
      summary: Log in with a pairing code instead of a QR
      description: "On the phone: Linked devices → Link a device → Link with phone number instead."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+5511988887777" }
      responses:
        "200":
          description: Pairing code
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: "ABCD-EFGH" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /logout:
    post:
      tags: [Session]
      summary: Unlink this device and delete the session
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /send:
    post:
      tags: [Messaging]
      summary: Send a text message
      description: |
        Optionally quote a stored message with `reply_to` (not a deleted one; an edited one is quoted with its
        current text). With an idempotency key, a repeat within 24 h returns the first result instead of
        sending again; failed sends aren't remembered. The key is bound to `to`, `text` and `reply_to`; reusing it
        for a different request is a 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, text]
              properties:
                to: { type: string, example: "5511999999999" }
                text: { type: string, example: "Hello from *wabot* 👋" }
                reply_to: { type: string, description: "id of a stored message in the same chat to quote", example: "3EB0C767D26A1D0F5E2A" }
                idempotency_key: { type: string, maxLength: 200, description: "Same as the Idempotency-Key header; the header wins." }
      responses:
        "200": { $ref: "#/components/responses/MessageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/Timeout" }

  /send/file:
    post:
      tags: [Messaging]
      summary: Send an image or document
      description: |
        Images (detected from the content) go as photos, anything else as a document. Max 64 MB. An idempotency
        key is bound to `to`, the file name, `caption`, `reply_to` and the file's SHA-256; reusing it for a
        different request is a 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [to, file]
              properties:
                to: { type: string, example: "5511999999999" }
                file: { type: string, format: binary }
                caption: { type: string }
                reply_to: { type: string, description: "id of a stored message in the same chat to quote" }
                idempotency_key: { type: string, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/MessageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/Timeout" }

  /react:
    post:
      tags: [Messaging]
      summary: React to a message
      description: An empty `emoji` removes your reaction. Returns the reaction as a Message (`type` reaction).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, id]
              properties:
                chat: { type: string, example: "5511999999999" }
                id: { type: string, example: "3EB0C767D26A1D0F5E2A" }
                emoji: { type: string, example: "👍" }
      responses:
        "200": { $ref: "#/components/responses/MessageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/Timeout" }

  /edit:
    post:
      tags: [Messaging]
      summary: Edit one of your text messages
      description: Only your own text messages, within 20 minutes of sending (WhatsApp's edit window); otherwise 400. Returns the updated Message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, id, text]
              properties:
                chat: { type: string, example: "5511999999999" }
                id: { type: string, example: "3EB0C767D26A1D0F5E2A" }
                text: { type: string, example: "fixed typo" }
      responses:
        "200": { $ref: "#/components/responses/MessageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/Timeout" }

  /delete:
    post:
      tags: [Messaging]
      summary: Delete a message for everyone
      description: Your own messages, or other people's in groups where you're an admin. Returns the updated Message (`deleted` true, empty `text`). The stored copy of the original is dropped, so its media can no longer be downloaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat, id]
              properties:
                chat: { type: string, example: "5511999999999" }
                id: { type: string, example: "3EB0C767D26A1D0F5E2A" }
      responses:
        "200": { $ref: "#/components/responses/MessageResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/Timeout" }

  /read:
    post:
      tags: [Messaging]
      summary: Send read receipts
      description: Marks the given incoming messages as read, or the latest 50 incoming messages in the chat when no ids are given. Own messages, reactions and unknown ids are skipped. Also moves the chat's read position (used for `unread` in /chats) to the whole chat, or up to the newest of the given ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat]
              properties:
                chat: { type: string, example: "5511999999999" }
                id: { type: string }
                ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Number of messages marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked: { type: integer, example: 3 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /typing:
    post:
      tags: [Messaging]
      summary: Show a typing or recording indicator
      description: Counts against the number-lookup limit. Without `-online`, the account goes "available" for `typing`/`recording` and back to unavailable on `paused`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat]
              properties:
                chat: { type: string, example: "5511999999999" }
                state: { type: string, enum: [typing, recording, paused], default: typing }
      responses:
        "200": { $ref: "#/components/responses/OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /messages:
    get:
      tags: [Reading]
      summary: Stored messages
      description: |
        Without `since`: newest first by timestamp. With `since`: oldest first by `seq`, starting after
        `since` (cursor paging: pass the last `seq` you got as the next `since`).
      parameters:
        - $ref: "#/components/parameters/Chat"
        - $ref: "#/components/parameters/Type"
        - $ref: "#/components/parameters/FromMe"
        - $ref: "#/components/parameters/IsGroup"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Q"
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 1000 } }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /messages/wait:
    get:
      tags: [Reading]
      summary: Long-poll for new messages
      description: |
        Returns as soon as at least one message matching the filters exists after `since`, or after `timeout`
        seconds with an empty list. Without `since` it waits for messages that arrive after the request.
        Pass `next_since` as `since` on the next call.
      parameters:
        - $ref: "#/components/parameters/Chat"
        - $ref: "#/components/parameters/Type"
        - $ref: "#/components/parameters/FromMe"
        - $ref: "#/components/parameters/IsGroup"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Q"
        - { name: timeout, in: query, description: "Seconds to wait.", schema: { type: integer, default: 30, maximum: 120 } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: New messages (possibly none) and the cursor for the next call
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  next_since: { type: integer, format: int64, example: 1043 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { description: "Too many open streams for this token (max 4)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /events:
    get:
      tags: [Reading]
      summary: Live Server-Sent Events stream
      description: |
        Events: `message` (a Message, with `id: <seq>`), `update` (the Message after an edit or delete) and
        `status` (a Status). Stored messages after a starting seq are replayed first: a numeric `Last-Event-ID`
        header (sent by `EventSource` on reconnect) wins, then `since`, otherwise only new messages. Messages
        imported by a history sync are streamed too. Filters apply to `message` and `update`. A `: ping` comment is sent every 25 s. Swagger can't display streams; use
        `curl -N` or `EventSource`.
      parameters:
        - $ref: "#/components/parameters/Chat"
        - $ref: "#/components/parameters/Type"
        - $ref: "#/components/parameters/FromMe"
        - $ref: "#/components/parameters/IsGroup"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Q"
        - name: events
          in: query
          description: "Comma-separated subset of message,update,status. Default: all."
          schema: { type: string, example: "message,update" }
        - name: Last-Event-ID
          in: header
          description: "Resume after this seq. Takes precedence over `since`; a non-numeric value is ignored."
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }
              example: "id: 1043\nevent: message\ndata: {\"seq\":1043,\"text\":\"oi!\"}\n\n"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { description: "Too many open streams for this token (max 4)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /media/{seq}:
    get:
      tags: [Reading]
      summary: Download the media of a stored message
      description: |
        Fetched from WhatsApp and decrypted on each request. Capped at 100 MB of actual data. Images (not SVG),
        audio, video and PDF are served inline with their own Content-Type; anything else as
        `application/octet-stream` with `Content-Disposition: attachment`. Responses carry
        `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox; default-src 'none'` and
        `Referrer-Policy: no-referrer`. A deleted message's media is a 404.
      parameters:
        - { name: seq, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The file, with a Content-Disposition file name
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Media expired on WhatsApp's servers (WhatsApp answered 403, 404 or 410)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /chats:
    get:
      tags: [Reading]
      summary: Conversations by most recent activity
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 1000 } }
      responses:
        "200":
          description: Chats
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /contacts:
    get:
      tags: [Directory]
      summary: Address-book contacts synced from the phone
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Filter by name or part of the number." }
      responses:
        "200":
          description: Contacts sorted by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /groups:
    get:
      tags: [Directory]
      summary: Groups you're in
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    jid: { type: string, example: "120363012345678901@g.us" }
                    name: { type: string, example: "Family" }
                    members: { type: integer, example: 12 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /check:
    post:
      tags: [Directory]
      summary: Which phone numbers have WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phones]
              properties:
                phones:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string }
                  example: ["+5511999999999", "15551234567"]
      responses:
        "200":
          description: One result per number
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    query: { type: string }
                    on_whatsapp: { type: boolean }
                    jid: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /audit:
    get:
      tags: [Admin]
      summary: Control actions, newest first
      description: Sends, files, reactions, edits, deletes (every attempt, including ones rejected for bad input), read receipts, pairing and logout. Message text is never stored.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: before, in: query, description: "Only entries with a lower id (cursor).", schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tokens:
    get:
      tags: [Tokens]
      summary: List API tokens
      description: Every token, oldest first, including revoked and expired ones. Secrets and hashes are never returned. Requires admin.
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tokens]
      summary: Create an API token
      description: |
        Requires admin. The plaintext token is returned once. When the caller is itself a token, it can't create
        `admin` tokens (403), and the new token records `created_by`, can't expire after the caller and is revoked
        with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,39}$", example: "support-bot", description: "Unique forever; api, owner, local, tui, cli, autoreply, whatsapp are reserved" }
                scopes:
                  type: array
                  items: { type: string, enum: [read, send, admin] }
                  example: [read, send]
                chats:
                  type: array
                  items: { type: string }
                  description: Phone numbers or JIDs the token is limited to; empty means all chats. Not allowed with admin.
                  example: ["5511999999999"]
                rate: { type: integer, minimum: 0, description: "Sends per minute for this token. Omitted = 10; 0 = global limit only" }
                expires_in: { type: string, description: "Go duration, e.g. 720h. Omitted = never", example: "720h" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "wabot_k3x7q2ma_…", description: "Shown only now" }
                  details: { $ref: "#/components/schemas/Token" }
                  note: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tokens/{name}:
    delete:
      tags: [Tokens]
      summary: Revoke a token
      description: Revokes the token and every token it created, recursively. Open streams using them close within 10 s. Requires admin.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Number of tokens revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer, example: 2 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /docs:
    get:
      tags: [Docs]
      summary: This Swagger UI page
      description: Loads swagger-ui-dist from jsDelivr with Subresource Integrity (sha384) hashes.
      security: []
      responses:
        "200":
          description: HTML
          content:
            text/html:
              schema: { type: string }

  /openapi.yaml:
    get:
      tags: [Docs]
      summary: This OpenAPI spec
      security: []
      responses:
        "200":
          description: YAML
          content:
            application/yaml:
              schema: { type: string }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        An API token (`wabot_<id>_<secret>`) or the owner secret. Scopes: `read` (status, chats, messages,
        events, media, contacts, groups), `send` (send, file, react, edit, delete, read receipts, typing,
        check), `admin` (everything, incl. qr/pair/logout, audit and tokens). Tokens may be limited to a
        chat allowlist and have their own send rate (default 10/min).

  parameters:
    Chat:
      name: chat
      in: query
      description: "Phone number or JID; matches the chat or the sender."
      schema: { type: string, example: "5511999999999" }
    Type:
      name: type
      in: query
      description: "Comma-separated message types, e.g. text,image."
      schema: { type: string, example: "text,image" }
    FromMe:
      name: from_me
      in: query
      schema: { type: boolean }
    IsGroup:
      name: is_group
      in: query
      schema: { type: boolean }
    Since:
      name: since
      in: query
      description: "Only messages with a higher seq."
      schema: { type: integer, format: int64, minimum: 0 }
    Q:
      name: q
      in: query
      description: |
        Text search. Every word must match a whole word of the message text, the last one as a prefix
        ("bom di" finds "bom dia"). Case and accents are ignored ("cafe" finds "café"). Deleted messages
        aren't found; edited messages are found by their current text.
      schema: { type: string, example: "bom dia" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: "A repeat of the same request with the same key within 24 h returns the first result instead of sending again; the same key with a different request is a 409. Failures aren't cached. Max 200 characters."
      schema: { type: string, maxLength: 200, example: "order-1234-shipped" }

  responses:
    OK:
      description: Done
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: true }
    MessageResult:
      description: The resulting message
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    BadRequest:
      description: Bad input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or wrong token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        The token lacks the route's scope, or is limited to chats and the request is outside them
        ("this token can't access that chat") or uses an endpoint not available to restricted tokens;
        in token-less mode, the request isn't a same-origin request over loopback.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The idempotency key was already used for a different request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "idempotency key was already used for a different request" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: The send would have to wait longer than -max-wait
      headers:
        Retry-After:
          description: Seconds until a retry can succeed
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: WhatsApp rejected or failed the request, or not logged in
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Timeout:
      description: Timed out or cancelled
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: "not logged in" }
    Status:
      type: object
      properties:
        connected: { type: boolean }
        logged_in: { type: boolean }
        jid: { type: string, example: "5511988887777@s.whatsapp.net" }
        push_name: { type: string }
        qr: { type: string, description: "Raw QR data while waiting for a scan" }
        state:
          type: string
          example: connected
          description: "starting, connecting, waiting_for_qr_scan, paired, connected, disconnected, qr_timeout, logged_out, login_error: …"
    Media:
      type: object
      properties:
        mimetype: { type: string, example: "image/jpeg" }
        file_name: { type: string, description: "Documents only" }
        size: { type: integer, format: int64, example: 183204 }
        path: { type: string, description: "Download path relative to the API base", example: "/media/1042" }
    Message:
      type: object
      properties:
        seq: { type: integer, format: int64, description: "Monotonic cursor assigned when stored", example: 1042 }
        id: { type: string, example: "3EB0C767D26A1D0F5E2A" }
        chat: { type: string, example: "5511999999999@s.whatsapp.net" }
        sender: { type: string, example: "5511999999999@s.whatsapp.net" }
        push_name: { type: string, example: "Maria" }
        from_me: { type: boolean }
        is_group: { type: boolean }
        type: { type: string, enum: [text, image, video, document, audio, sticker, reaction, location], description: "video includes round video notes" }
        text: { type: string, description: "Body, caption, file name for documents, emoji for reactions; empty after delete" }
        reply_to: { type: string, description: "Quoted message id, or the target of a reaction" }
        media: { $ref: "#/components/schemas/Media" }
        edited: { type: boolean }
        deleted: { type: boolean }
        timestamp: { type: string, format: date-time }
    Chat:
      type: object
      properties:
        jid: { type: string }
        name: { type: string, description: "Contact or group name; ~Name is the person's WhatsApp profile name" }
        is_group: { type: boolean }
        last_text: { type: string }
        last_type: { type: string }
        last_from_me: { type: boolean }
        last_at: { type: string, format: date-time }
        unread:
          type: integer
          description: >-
            Incoming messages (not reactions, not deleted) after the chat's read position. The position moves when
            you send in the chat, open it in the TUI, call /read, or read it on another device.
          example: 2
    Contact:
      type: object
      properties:
        jid: { type: string }
        phone: { type: string, example: "+5511999999999" }
        name: { type: string }
        push_name: { type: string }
    Token:
      type: object
      description: An API token as stored. The secret and its hash are never returned.
      properties:
        id: { type: string, example: "k3x7q2ma" }
        name: { type: string, example: "support-bot" }
        scopes:
          type: array
          items: { type: string, enum: [read, send, admin] }
        chats:
          type: array
          items: { type: string }
          description: Allowlist (JIDs); omitted means every chat
        rate: { type: integer, description: "Per-token sends per minute; omitted means global limit only" }
        created: { type: string, format: date-time }
        expires: { type: string, format: date-time, description: "Omitted when the token never expires" }
        last_used: { type: string, format: date-time }
        revoked: { type: boolean }
        created_by: { type: string, description: "Name of the token that created this one over the API; omitted for the CLI or owner" }
    AuditEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor: { type: string, description: "Token name for API/MCP calls (api = owner secret or token-less, mcp = stdio without a token), or tui, cli, autoreply, whatsapp", example: "support-bot" }
        action: { type: string, enum: [send, send_file, react, edit, delete, read, pair, logout, logged_out, token_create, token_revoke] }
        target: { type: string, description: "Chat JID, when there is one" }
        detail: { type: string, example: "text, 6 chars" }
        ok: { type: boolean }
        error: { type: string }
